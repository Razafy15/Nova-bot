<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Bot - SMC & Spike Strategy</title>
    <!-- Lightweight Charts Library -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #4CAF50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-start { background: #4CAF50; color: white; }
        .btn-stop { background: #f44336; color: white; }
        .btn-config { background: #ff9800; color: white; }
        #chart { width: 100%; height: 400px; margin-top: 20px; background: #181818; border-radius: 4px; }
        .stats { display: flex; justify-content: space-between; margin-top: 20px; background: #252525; padding: 15px; border-radius: 4px; }
        .stat-box { text-align: center; }
        .stat-box span { display: block; font-size: 18px; font-weight: bold; color: #4CAF50; }
        .signal-box { margin-top: 15px; background: #2d2d2d; padding: 10px; border-left: 4px solid #4CAF50; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Deriv Trading Bot</h1>
        
        <!-- Fidirana Paramètre -->
        <div class="form-group">
            <label>App ID:</label>
            <input type="text" id="appId" value="1089">
        </div>
        <div class="form-group">
            <label>API Token:</label>
            <input type="password" id="apiToken" placeholder="Ampidiro eto ny Token-nao">
        </div>
        <div class="form-group">
            <label>Tsena (Symbol):</label>
            <select id="symbol">
                <option value="1HZ25V">Volatility 25 (1HZ25V)</option>
                <option value="1HZ50V">Volatility 50 (1HZ50V)</option>
                <option value="BOOM150">Boom 150</option>
                <option value="CRASH150">Crash 150</option>
            </select>
        </div>
        <div class="form-group">
            <label>Stake (USD):</label>
            <input type="number" id="stake" value="1.0" step="0.1">
        </div>
        
        <button class="btn-config" onclick="configureBot()">Rindra (Configure)</button>
        <button class="btn-start" onclick="startBot()">Alefa (Start)</button>
        <button class="btn-stop" onclick="stopBot()">Ajanona (Stop)</button>

        <!-- Sary / Chart -->
        <div id="chart"></div>

        <!-- Estatistika -->
        <div class="stats">
            <div class="stat-box">Balance: <span id="stBal">0.00</span> USD</div>
            <div class="stat-box">Trades Vita: <span id="stTr">0</span></div>
            <div class="stat-box">Profit: <span id="stPl">0.00</span> USD</div>
        </div>

        <div class="signal-box">
            <strong>Siny farany:</strong> <span id="stSignal">Miandry fepetra...</span>
        </div>
    </div>

    <script>
        // Famoronana ny Tabilao (Chart)
        const chartElement = document.getElementById('chart');
        const chart = LightweightCharts.createChart(chartElement, {
            layout: { background: { color: '#181818' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2b2b2b' }, horzLines: { color: '#2b2b2b' } },
        });
        const candleSeries = chart.addCandlestickSeries();

        async function configureBot() {
            const appId = document.getElementById('appId').value;
            const apiToken = document.getElementById('apiToken').value;
            const symbol = document.getElementById('symbol').value;
            const stake = document.getElementById('stake').value;

            const res = await fetch('/api/configure', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ app_id: appId, api_token: apiToken, symbol: symbol, stake: stake })
            });
            const data = await res.json();
            alert(data.message);
        }

        async function startBot() {
            const symbol = document.getElementById('symbol').value;
            const stake = document.getElementById('stake').value;
            const res = await fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: symbol, stake: stake })
            });
            const data = await res.json();
            alert(data.message);
        }

        async function stopBot() {
            const res = await fetch('/api/stop', { method: 'POST' });
            const data = await res.json();
            alert(data.message);
        }

        async function updateUI() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                
                document.getElementById('stBal').innerText = data.balance.toFixed(2);
                document.getElementById('stTr').innerText = data.total_trades;
                document.getElementById('stPl').innerText = data.profit.toFixed(2);
                document.getElementById('stSignal').innerText = data.last_signal;

                // Antoka fa mivoaka foana ny sary na dia mbola miandry signal aza
                if (data.ui_candles && data.ui_candles.length > 0) {
                    candleSeries.setData(data.ui_candles);
                } else {
                    // Sary vonjimaika raha mbola miandry angona avy amin'ny server
                    const now = Math.floor(Date.now() / 1000);
                    candleSeries.setData([
                        { time: now - 120, open: 100, high: 105, low: 95, close: 102 },
                        { time: now - 60, open: 102, high: 108, low: 100, close: 106 },
                        { time: now, open: 106, high: 110, low: 104, close: 108 }
                    ]);
                }
                chart.timeScale().fitContent();
            } catch (e) {
                console.log("Olana tamin'ny fakana UI:", e);
            }
        }

        // Fanavaozana ny pejy isaky ny segondra
        setInterval(updateUI, 1000);
        updateUI();
    </script>
</body>
</html>
