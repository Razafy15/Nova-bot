<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Bot - SMC & Spike Strategy</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #38bdf8; font-size: 24px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 14px; }
        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-config { background: #f59e0b; color: white; }
        .btn-start { background: #22c55e; color: white; }
        .btn-stop { background: #ef4444; color: white; }
        #chart { width: 100%; height: 350px; margin-top: 20px; background: #0b0f19; border-radius: 8px; border: 1px solid #334155; }
        .stats { display: flex; justify-content: space-between; margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .stat-box { text-align: center; flex: 1; }
        .stat-box small { display: block; color: #94a3b8; font-size: 12px; margin-bottom: 3px; }
        .stat-box span { display: block; font-size: 16px; font-weight: bold; color: #38bdf8; }
        .signal-box { margin-top: 15px; background: #0f172a; padding: 12px; border-left: 4px solid #38bdf8; font-family: monospace; font-size: 13px; border-radius: 0 6px 6px 0; border-top: 1px solid #334155; border-right: 1px solid #334155; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Deriv Trading Bot</h1>
        
        <div class="form-group">
            <label>App ID:</label>
            <input type="text" id="appId" value="1089">
        </div>
        <div class="form-group">
            <label>API Token:</label>
            <input type="password" id="apiToken" placeholder="Ampidiro eto ny Token-nao">
        </div>
        <!-- Eto ilay safidy Kaonty Demo na Real -->
        <div class="form-group">
            <label>Karazana Kaonty (Account Type):</label>
            <select id="accountType">
                <option value="demo">Demo (Fitsapana)</option>
                <option value="real">Real (Tena izy)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Tsena (Symbol):</label>
            <select id="symbol">
                <option value="1HZ25V">Volatility 25 (1HZ25V)</option>
                <option value="1HZ50V">Volatility 50 (1HZ50V)</option>
                <option value="BOOM150">Boom 150</option>
                <option value="CRASH150">Crash 150</option>
            </select>
        </div>
        <div class="form-group">
            <label>Stake (USD):</label>
            <input type="number" id="stake" value="1.0" step="0.1">
        </div>
        
        <div class="btn-container">
            <button class="btn-config" onclick="configureBot()">Rindra</button>
            <button class="btn-start" onclick="startBot()">Alefa</button>
            <button class="btn-stop" onclick="stopBot()">Ajanona</button>
        </div>

        <div id="chart"></div>

        <div class="stats">
            <div class="stat-box"><small>BALANCE</small><span id="stBal">0.00</span></div>
            <div class="stat-box"><small>TRADES</small><span id="stTr">0</span></div>
            <div class="stat-box"><small>PROFIT</small><span id="stPl">0.00</span></div>
        </div>

        <div class="signal-box">
            <strong>Siny:</strong> <span id="stSignal">Miandry fepetra...</span>
        </div>
    </div>

    <script>
        const chartElement = document.getElementById('chart');
        const chart = LightweightCharts.createChart(chartElement, {
            layout: { background: { color: '#0b0f19' }, textColor: '#94a3b8' },
            grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
            timeScale: { borderColor: '#334155' },
            rightPriceScale: { borderColor: '#334155' }
        });
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#22c55e', downColor: '#ef4444',
            borderUpColor: '#22c55e', borderDownColor: '#ef4444',
            wickUpColor: '#22c55e', wickDownColor: '#ef4444',
        });

        async function configureBot() {
            const appId = document.getElementById('appId').value;
            const apiToken = document.getElementById('apiToken').value;
            const accountType = document.getElementById('accountType').value;
            const symbol = document.getElementById('symbol').value;
            const stake = document.getElementById('stake').value;

            const res = await fetch('/api/configure', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ app_id: appId, api_token: apiToken, account_type: accountType, symbol: symbol, stake: stake })
            });
            const data = await res.json();
            alert(data.message);
        }

        async function startBot() {
            const symbol = document.getElementById('symbol').value;
            const stake = document.getElementById('stake').value;
            const res = await fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: symbol, stake: stake })
            });
            const data = await res.json();
            alert(data.message);
        }

        async function stopBot() {
            const res = await fetch('/api/stop', { method: 'POST' });
            const data = await res.json();
            alert(data.message);
        }

        async function updateUI() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                
                document.getElementById('stBal').innerText = data.balance.toFixed(2) + " USD";
                document.getElementById('stTr').innerText = data.total_trades;
                document.getElementById('stPl').innerText = data.profit.toFixed(2) + " USD";
                document.getElementById('stSignal').innerText = data.last_signal;

                if (data.ui_candles && data.ui_candles.length > 0) {
                    candleSeries.setData(data.ui_candles);
                } else {
                    const now = Math.floor(Date.now() / 1000);
                    candleSeries.setData([
                        { time: now - 120, open: 100, high: 105, low: 95, close: 102 },
                        { time: now - 60, open: 102, high: 108, low: 100, close: 106 },
                        { time: now, open: 106, high: 110, low: 104, close: 108 }
                    ]);
                }
                chart.timeScale().fitContent();
            } catch (e) {
                console.log("Olana tamin'ny fakana UI:", e);
            }
        }

        setInterval(updateUI, 1000);
        updateUI();
    </script>
</body>
</html>
