<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Nova Bot</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        #070b14;

    color: #f5f7fb;
}

.app {
    max-width: 1500px;
    margin: auto;
    padding: 18px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.logo span {
    color: #36d399;
}

.status {
    padding: 9px 14px;
    border-radius: 30px;
    background: #151c2c;
    font-size: 13px;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 7px;
    background: #777;
}

.connected .dot {
    background: #36d399;
}

.error .dot {
    background: #ef4444;
}

/* GRID */

.grid {
    display: grid;
    grid-template-columns:
        300px
        minmax(0, 1fr);

    gap: 18px;
}

/* PANEL */

.panel {
    background: #0d1320;
    border: 1px solid #1c2638;
    border-radius: 16px;
    padding: 18px;
}

.panel h3 {
    margin-top: 0;
}

/* INPUT */

label {
    display: block;
    font-size: 12px;
    color: #8d99ae;
    margin-top: 13px;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #273247;
    background: #080d17;
    color: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #36d399;
}

button {
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #36d399;
    color: #04120d;
    font-weight: 800;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-bottom: 15px;
}

.card {
    background: #0d1320;
    border: 1px solid #1c2638;
    border-radius: 14px;
    padding: 15px;
}

.card small {
    color: #7f8aa0;
}

.card strong {
    display: block;
    margin-top: 6px;
    font-size: 20px;
}

/* CHART */

.chart-panel {
    background: #0d1320;
    border: 1px solid #1c2638;
    border-radius: 16px;
    overflow: hidden;
}

.chart-header {
    padding: 15px 18px;
    border-bottom: 1px solid #1c2638;

    display: flex;
    justify-content: space-between;
}

#chart {
    width: 100%;
    height: 520px;
}

/* MESSAGE */

.message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #111a2a;
    color: #aab5c7;
    font-size: 13px;
}

.error-box {
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    background: #32141a;
    color: #ff9b9b;
    font-size: 13px;
}

/* MOBILE */

@media(max-width: 850px) {

    .grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

    #chart {
        height: 420px;
    }
}

@media(max-width: 500px) {

    .app {
        padding: 10px;
    }

    .header {
        align-items: flex-start;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .card strong {
        font-size: 17px;
    }

    #chart {
        height: 360px;
    }
}

</style>

</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">
            NOVA<span>BOT</span>
        </div>

        <div
            id="status"
            class="status"
        >
            <span class="dot"></span>
            Disconnected
        </div>

    </div>


    <div class="grid">

        <!-- SETTINGS -->

        <div class="panel">

            <h3>Deriv Connection</h3>

            <label>
                App ID
            </label>

            <input
                id="appId"
                type="text"
                autocomplete="off"
                placeholder="New App ID"
            >


            <label>
                PAT Token
            </label>

            <input
                id="patToken"
                type="password"
                autocomplete="off"
                placeholder="PAT Token"
            >


            <label>
                Account ID
            </label>

            <input
                id="accountId"
                type="text"
                autocomplete="off"
                placeholder="DOT..."
            >


            <label>
                Market
            </label>

            <select id="symbol">

                <option>BOOM500</option>
                <option>BOOM300</option>
                <option>BOOM600</option>
                <option>BOOM900</option>
                <option>BOOM1000</option>

                <option>CRASH300</option>
                <option>CRASH500</option>
                <option>CRASH600</option>
                <option>CRASH900</option>
                <option>CRASH1000</option>

                <option>1HZ10V</option>
                <option>1HZ25V</option>
                <option>1HZ50V</option>
                <option>1HZ75V</option>
                <option>1HZ100V</option>

            </select>


            <button
                onclick="connectDeriv()"
            >
                CONNECT DERIV
            </button>


            <div
                id="message"
                class="message"
            >
                Miandry connexion...
            </div>


            <div
                id="error"
                class="error-box"
                style="display:none"
            ></div>

        </div>


        <!-- MAIN -->

        <div>

            <div class="stats">

                <div class="card">
                    <small>Balance</small>
                    <strong id="balance">
                        0.00
                    </strong>
                </div>

                <div class="card">
                    <small>Market</small>
                    <strong id="market">
                        BOOM500
                    </strong>
                </div>

                <div class="card">
                    <small>Price</small>
                    <strong id="price">
                        0
                    </strong>
                </div>

            </div>


            <div class="chart-panel">

                <div class="chart-header">

                    <strong id="chartTitle">
                        BOOM500
                    </strong>

                    <span>
                        LIVE
                    </span>

                </div>

                <div id="chart"></div>

            </div>

        </div>

    </div>

</div>


<script>

let chart;
let candleSeries;

const chartElement =
    document.getElementById("chart");


/* =====================================================
   CHART
===================================================== */

function createChart() {

    chart =
        LightweightCharts.createChart(
            chartElement,
            {
                layout: {
                    background: {
                        color: "#0d1320"
                    },

                    textColor: "#9aa5b8"
                },

                grid: {
                    vertLines: {
                        color: "#182235"
                    },

                    horzLines: {
                        color: "#182235"
                    }
                },

                rightPriceScale: {
                    borderColor: "#263249"
                },

                timeScale: {
                    borderColor: "#263249",
                    timeVisible: true
                }
            }
        );


    candleSeries =
        chart.addCandlestickSeries();


    window.addEventListener(
        "resize",
        () => {

            chart.applyOptions({
                width:
                    chartElement.clientWidth
            });

        }
    );
}


createChart();


/* =====================================================
   CONNECT
===================================================== */

async function connectDeriv() {

    const appId =
        document.getElementById(
            "appId"
        ).value.trim();

    const patToken =
        document.getElementById(
            "patToken"
        ).value.trim();

    const accountId =
        document.getElementById(
            "accountId"
        ).value.trim();

    const symbol =
        document.getElementById(
            "symbol"
        ).value;


    if (!appId ||
        !patToken ||
        !accountId) {

        showError(
            "Fenoy App ID, PAT Token ary Account ID."
        );

        return;
    }


    setMessage(
        "Connexion amin'i Deriv..."
    );


    try {

        const response =
            await fetch(
                "/api/connect",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        app_id: appId,
                        pat_token: patToken,
                        account_id: accountId,
                        symbol: symbol
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showError(
                data.message ||
                "Connection error"
            );

            return;
        }


        setMessage(
            data.message ||
            "Connexion natomboka..."
        );

    } catch(error) {

        showError(
            error.message
        );
    }
}


/* =====================================================
   MESSAGE
===================================================== */

function setMessage(text) {

    document.getElementById(
        "message"
    ).textContent = text;
}


function showError(text) {

    const box =
        document.getElementById(
            "error"
        );

    box.textContent = text;
    box.style.display = "block";
}


function clearError() {

    const box =
        document.getElementById(
            "error"
        );

    box.textContent = "";
    box.style.display = "none";
}


/* =====================================================
   UPDATE UI
===================================================== */

async function updateUI() {

    try {

        const response =
            await fetch(
                "/api/stats",
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        /* STATUS */

        const status =
            document.getElementById(
                "status"
            );


        status.className =
            "status";


        if (data.connected) {

            status.classList.add(
                "connected"
            );

            status.innerHTML =
                '<span class="dot"></span>Connected';

        } else if (
            data.connecting
        ) {

            status.innerHTML =
                '<span class="dot"></span>Connecting...';

        } else {

            status.innerHTML =
                '<span class="dot"></span>Disconnected';
        }


        /* STATS */

        document.getElementById(
            "balance"
        ).textContent =
            Number(
                data.balance || 0
            ).toFixed(2)
            + " "
            + (data.currency || "USD");


        document.getElementById(
            "price"
        ).textContent =
            Number(
                data.price || 0
            ).toFixed(5);


        document.getElementById(
            "market"
        ).textContent =
            data.symbol || "-";


        document.getElementById(
            "chartTitle"
        ).textContent =
            data.symbol || "-";


        /* MESSAGE */

        setMessage(
            data.message || ""
        );


        /* ERROR */

        if (data.error) {

            showError(
                data.error
            );

        } else {

            clearError();
        }


        /* CHART */

        if (
            Array.isArray(data.chart) &&
            data.chart.length > 0
        ) {

            candleSeries.setData(
                data.chart
            );

            chart.timeScale()
                .fitContent();
        }

    } catch(error) {

        console.log(
            "UI update error:",
            error
        );
    }
}


/* =====================================================
   POLLING
===================================================== */

setInterval(
    updateUI,
    1000
);

updateUI();


/* =====================================================
   SYMBOL CHANGE
===================================================== */

document
    .getElementById("symbol")
    .addEventListener(
        "change",
        async function() {

            const symbol =
                this.value;

            document.getElementById(
                "chartTitle"
            ).textContent =
                symbol;

            try {

                await fetch(
                    "/api/symbol",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            symbol: symbol
                        })
                    }
                );

            } catch(error) {

                console.log(error);
            }
        }
    );

</script>

</body>
</html>
