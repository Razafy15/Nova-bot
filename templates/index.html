<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BOOM FALL BOT</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #070914;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #0d1020;
            border-bottom: 1px solid #252a43;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
        }

        .status {
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .offline {
            background: #401722;
            color: #ff7182;
        }

        .online {
            background: #123b2b;
            color: #45f39b;
        }

        main {
            max-width: 1250px;
            margin: auto;
            padding: 18px;
        }

        .panel {
            background: #101426;
            border: 1px solid #252a43;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .connection-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #30364f;
            background: #080b17;
            color: white;
            outline: none;
        }

        label {
            display: block;
            font-size: 12px;
            color: #8e96b5;
            margin-bottom: 7px;
        }

        button {
            border: 0;
            padding: 13px 18px;
            border-radius: 9px;
            color: white;
            font-weight: 800;
            cursor: pointer;
        }

        .connect {
            margin-top: 14px;
            background: #7257ff;
        }

        .connect:hover {
            opacity: .9;
        }

        .connection-message {
            margin-top: 12px;
            color: #8e96b5;
            font-size: 13px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .card {
            background: #101426;
            border: 1px solid #252a43;
            border-radius: 14px;
            padding: 16px;
        }

        .card-label {
            color: #8e96b5;
            font-size: 12px;
        }

        .card-value {
            margin-top: 8px;
            font-size: 22px;
            font-weight: 900;
        }

        .trading-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .settings {
            display: grid;
            gap: 10px;
        }

        .row {
            background: #080b17;
            border-radius: 9px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
        }

        .muted {
            color: #8e96b5;
        }

        .fall {
            color: #ff6375;
            font-weight: 900;
        }

        .buttons {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .start {
            background: #16a765;
        }

        .pause {
            background: #b98218;
        }

        .stop {
            background: #c83249;
        }

        .error {
            margin-top: 12px;
            padding: 11px;
            background: #381721;
            color: #ff8796;
            border-radius: 9px;
            display: none;
        }

        @media(max-width: 800px) {

            .connection-grid {
                grid-template-columns: 1fr;
            }

            .trading-grid {
                grid-template-columns: 1fr;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

        }

    </style>

</head>


<body>

<header>

    <div class="brand">
        🤖 BOOM FALL BOT
    </div>

    <div
        id="connectionStatus"
        class="status offline"
    >
        ● DISCONNECTED
    </div>

</header>


<main>


    <!-- API CONNECTION -->

    <section class="panel">

        <div class="title">
            🔐 DERIV API CONNECTION
        </div>

        <div class="connection-grid">

            <div>

                <label>
                    App ID
                </label>

                <input
                    id="appId"
                    type="text"
                    placeholder="Your App ID"
                >

            </div>


            <div>

                <label>
                    PAT / API Token
                </label>

                <input
                    id="token"
                    type="password"
                    placeholder="Your PAT"
                >

            </div>


            <div>

                <label>
                    Account ID
                </label>

                <input
                    id="accountId"
                    type="text"
                    placeholder="DOT..."
                >

            </div>

        </div>


        <button
            class="connect"
            onclick="connectDeriv()"
        >
            🔌 CONNECT DERIV
        </button>


        <div
            id="connectionMessage"
            class="connection-message"
        >
            Not connected
        </div>


        <div
            id="error"
            class="error"
        ></div>

    </section>


    <!-- STATS -->

    <section class="cards">

        <div class="card">

            <div class="card-label">
                BALANCE
            </div>

            <div
                id="balance"
                class="card-value"
            >
                $0.00
            </div>

        </div>


        <div class="card">

            <div class="card-label">
                ACCOUNT
            </div>

            <div
                id="accountType"
                class="card-value"
            >
                —
            </div>

        </div>


        <div class="card">

            <div class="card-label">
                CURRENCY
            </div>

            <div
                id="currency"
                class="card-value"
            >
                USD
            </div>

        </div>


        <div class="card">

            <div class="card-label">
                BOT STATUS
            </div>

            <div
                id="botStatus"
                class="card-value"
            >
                STOPPED
            </div>

        </div>

    </section>


    <!-- TRADING -->

    <section
        class="trading-grid"
        style="margin-top:16px"
    >


        <div class="panel">

            <div class="title">
                ⚙️ TRADING SETTINGS
            </div>

            <div class="settings">

                <div class="row">

                    <span class="muted">
                        Market
                    </span>

                    <strong>
                        BOOM
                    </strong>

                </div>


                <div class="row">

                    <span class="muted">
                        Direction
                    </span>

                    <strong class="fall">
                        PUT / FALL
                    </strong>

                </div>


                <div class="row">

                    <span class="muted">
                        Duration
                    </span>

                    <strong>
                        3 seconds
                    </strong>

                </div>


                <div class="row">

                    <span class="muted">
                        Martingale
                    </span>

                    <strong>
                        OFF
                    </strong>

                </div>

            </div>


            <div class="buttons">

                <button
                    class="start"
                    onclick="botCommand('/api/start')"
                >
                    START
                </button>

                <button
                    class="pause"
                    onclick="botCommand('/api/pause')"
                >
                    PAUSE
                </button>

                <button
                    class="stop"
                    onclick="botCommand('/api/stop')"
                >
                    STOP
                </button>

            </div>

        </div>


        <div class="panel">

            <div class="title">
                📡 CONNECTION INFO
            </div>

            <div class="settings">

                <div class="row">

                    <span class="muted">
                        Account ID
                    </span>

                    <strong id="shownAccount">
                        —
                    </strong>

                </div>


                <div class="row">

                    <span class="muted">
                        Connection
                    </span>

                    <strong id="shownConnection">
                        OFFLINE
                    </strong>

                </div>


                <div class="row">

                    <span class="muted">
                        Authorization
                    </span>

                    <strong id="shownAuth">
                        —
                    </strong>

                </div>

            </div>

        </div>


    </section>

</main>


<script>

async function connectDeriv() {

    const appId =
        document
        .getElementById("appId")
        .value
        .trim();

    const token =
        document
        .getElementById("token")
        .value
        .trim();

    const accountId =
        document
        .getElementById("accountId")
        .value
        .trim();


    const error =
        document
        .getElementById("error");


    error.style.display =
        "none";


    if (!appId ||
        !token ||
        !accountId) {

        showError(
            "Fill App ID, PAT and Account ID."
        );

        return;
    }


    setMessage(
        "Connecting to Deriv..."
    );


    try {

        const response =
            await fetch(
                "/api/connect",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        app_id:
                            appId,

                        token:
                            token,

                        account_id:
                            accountId
                    })
                }
            );


        const data =
            await response.json();


        if (!data.ok) {

            showError(
                data.error ||
                "Connection failed."
            );

            return;
        }


        setMessage(
            "WebSocket connection started..."
        );

    } catch (err) {

        showError(
            err.message
        );

    }

}


async function updateStatus() {

    try {

        const response =
            await fetch(
                "/api/status"
            );


        const data =
            await response.json();


        const status =
            document
            .getElementById(
                "connectionStatus"
            );


        if (
            data.connected &&
            data.authorized
        ) {

            status.textContent =
                "● CONNECTED";

            status.className =
                "status online";

            setMessage(
                "Deriv connected successfully."
            );

        } else {

            status.textContent =
                "● DISCONNECTED";

            status.className =
                "status offline";

        }


        document
            .getElementById(
                "balance"
            )
            .textContent =
            Number(data.balance)
            .toFixed(2) +
            " " +
            data.currency;


        document
            .getElementById(
                "currency"
            )
            .textContent =
            data.currency;


        document
            .getElementById(
                "accountType"
            )
            .textContent =
            data.account_type ||
            "—";


        document
            .getElementById(
                "shownAccount"
            )
            .textContent =
            data.account_id ||
            "—";


        document
            .getElementById(
                "shownConnection"
            )
            .textContent =
            data.connected
            ? "ONLINE"
            : "OFFLINE";


        document
            .getElementById(
                "shownAuth"
            )
            .textContent =
            data.authorized
            ? "AUTHORIZED"
            : "NOT AUTHORIZED";


        document
            .getElementById(
                "botStatus"
            )
            .textContent =
            data.running
            ? "RUNNING"
            : "STOPPED";


        if (data.last_error) {

            showError(
                data.last_error
            );

        }

    } catch (err) {

        console.error(err);

    }

}


async function botCommand(endpoint) {

    try {

        const response =
            await fetch(
                endpoint,
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (!data.ok) {

            showError(
                data.error ||
                "Command failed."
            );

        }

        updateStatus();

    } catch (err) {

        showError(
            err.message
        );

    }

}


function setMessage(message) {

    document
        .getElementById(
            "connectionMessage"
        )
        .textContent =
        message;

}


function showError(message) {

    const error =
        document
        .getElementById("error");

    error.textContent =
        message;

    error.style.display =
        "block";

}


updateStatus();

setInterval(
    updateStatus,
    1000
);

</script>

</body>

</html>
