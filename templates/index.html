<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deriv Pro Bot</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070b14;
    color:#f8fafc;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

.container{
    width:100%;
    max-width:1400px;
    margin:auto;
    padding:15px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.logo span{
    color:#38bdf8;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    background:#111827;
    padding:8px 13px;
    border-radius:20px;
    font-size:13px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ef4444;
}

.dot.connected{
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
}

/* GRID */

.dashboard{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:15px;
}

/* CARD */

.card{
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:14px;
    padding:15px;
}

.card-title{
    font-size:14px;
    font-weight:700;
    color:#94a3b8;
    margin-bottom:15px;
}

/* FORM */

label{
    display:block;
    font-size:12px;
    color:#94a3b8;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:1px solid #334155;
    background:#070b14;
    color:white;
    outline:none;
    margin-bottom:12px;
}

input:focus,
select:focus{
    border-color:#38bdf8;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

button{
    border:none;
    padding:11px;
    border-radius:8px;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.connect{
    background:#2563eb;
    grid-column:1 / -1;
}

.refresh{
    background:#334155;
}

.disconnect{
    background:#dc2626;
}

/* BALANCE */

.balance{
    font-size:25px;
    font-weight:800;
    color:#38bdf8;
    margin-bottom:5px;
}

.account{
    color:#94a3b8;
    font-size:12px;
}

/* MAIN */

.main{
    min-width:0;
}

.market-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.symbol{
    font-size:20px;
    font-weight:800;
}

.price{
    font-size:18px;
    color:#38bdf8;
    font-weight:700;
}

/* CHART */

.chart-box{
    width:100%;
    height:500px;
    background:#080d18;
    border:1px solid #1e293b;
    border-radius:14px;
    overflow:hidden;
}

#chart{
    width:100%;
    height:100%;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:12px;
}

.stat{
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:12px;
    padding:14px;
}

.stat small{
    display:block;
    color:#64748b;
    margin-bottom:5px;
}

.stat strong{
    font-size:17px;
}

/* SIGNAL */

.signal{
    margin-top:12px;
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:12px;
    padding:15px;
}

.signal-title{
    font-size:12px;
    color:#64748b;
    margin-bottom:7px;
}

.signal-text{
    font-size:15px;
    font-weight:700;
}

.signal.buy{
    border-left:4px solid #22c55e;
}

.signal.wait{
    border-left:4px solid #f59e0b;
}

.signal.error{
    border-left:4px solid #ef4444;
}

/* MESSAGE */

.message{
    margin-top:12px;
    padding:12px;
    background:#020617;
    border-radius:8px;
    color:#94a3b8;
    font-size:12px;
    word-break:break-word;
}

/* MOBILE */

@media(max-width:850px){

    .dashboard{
        grid-template-columns:1fr;
    }

    .chart-box{
        height:420px;
    }

}

@media(max-width:600px){

    .container{
        padding:9px;
    }

    .header{
        align-items:flex-start;
    }

    .logo{
        font-size:18px;
    }

    .dashboard{
        display:flex;
        flex-direction:column;
    }

    .chart-box{
        height:360px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .market-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .buttons{
        grid-template-columns:1fr 1fr;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            DERIV <span>PRO BOT</span>
        </div>

        <div class="status">

            <div id="statusDot" class="dot"></div>

            <span id="statusText">
                Disconnected
            </span>

        </div>

    </div>


    <div class="dashboard">

        <!-- SIDEBAR -->

        <div>

            <div class="card">

                <div class="card-title">
                    🔐 DERIV CONNECTION
                </div>

                <label>App ID</label>

                <input
                    id="appId"
                    type="text"
                    placeholder="Ampidiro App ID"
                >


                <label>PAT Token</label>

                <input
                    id="patToken"
                    type="password"
                    placeholder="PAT Token"
                >


                <label>Account ID</label>

                <input
                    id="accountId"
                    type="text"
                    placeholder="Account ID"
                >


                <label>Market</label>

                <select id="symbol">

                    <option value="BOOM500">
                        BOOM 500
                    </option>

                    <option value="BOOM1000">
                        BOOM 1000
                    </option>

                    <option value="BOOM300">
                        BOOM 300
                    </option>

                    <option value="BOOM150">
                        BOOM 150
                    </option>

                    <option value="CRASH500">
                        CRASH 500
                    </option>

                    <option value="CRASH1000">
                        CRASH 1000
                    </option>

                    <option value="CRASH300">
                        CRASH 300
                    </option>

                    <option value="CRASH150">
                        CRASH 150
                    </option>

                </select>


                <div class="buttons">

                    <button
                        class="connect"
                        onclick="connectDeriv()"
                    >
                        🔌 CONNECT
                    </button>

                    <button
                        class="refresh"
                        onclick="refreshMarket()"
                    >
                        🔄 REFRESH
                    </button>

                    <button
                        class="disconnect"
                        onclick="disconnectBot()"
                    >
                        ⛔ STOP
                    </button>

                </div>

            </div>


            <!-- BALANCE -->

            <div
                class="card"
                style="margin-top:12px;"
            >

                <div class="card-title">
                    💰 ACCOUNT
                </div>

                <div
                    class="balance"
                    id="balance"
                >
                    0.00 USD
                </div>

                <div
                    class="account"
                    id="account"
                >
                    Not connected
                </div>

            </div>


            <!-- BOT INFO -->

            <div
                class="card"
                style="margin-top:12px;"
            >

                <div class="card-title">
                    🤖 BOT STATUS
                </div>

                <div
                    id="botMessage"
                    class="message"
                >
                    Miandry connexion...
                </div>

            </div>

        </div>


        <!-- MAIN -->

        <div class="main">

            <div class="market-header">

                <div>

                    <div
                        class="symbol"
                        id="marketName"
                    >
                        BOOM500
                    </div>

                    <div
                        style="font-size:12px;color:#64748b;"
                    >
                        Live Market Chart
                    </div>

                </div>

                <div
                    class="price"
                    id="price"
                >
                    0.00000
                </div>

            </div>


            <!-- CHART -->

            <div class="chart-box">

                <div id="chart"></div>

            </div>


            <!-- STATS -->

            <div class="stats">

                <div class="stat">

                    <small>
                        MARKET
                    </small>

                    <strong id="statSymbol">
                        BOOM500
                    </strong>

                </div>


                <div class="stat">

                    <small>
                        PRICE
                    </small>

                    <strong id="statPrice">
                        0.00000
                    </strong>

                </div>


                <div class="stat">

                    <small>
                        CONNECTION
                    </small>

                    <strong id="statConnection">
                        OFF
                    </strong>

                </div>


                <div class="stat">

                    <small>
                        ACCOUNT
                    </small>

                    <strong id="statAccount">
                        —
                    </strong>

                </div>

            </div>


            <!-- SIGNAL -->

            <div
                id="signalBox"
                class="signal wait"
            >

                <div class="signal-title">
                    🔔 SIGNAL
                </div>

                <div
                    id="signalText"
                    class="signal-text"
                >
                    Miandry data avy amin'ny marché...
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* ==========================================================
   CHART
========================================================== */

const chartContainer =
    document.getElementById("chart");


const chart =
    LightweightCharts.createChart(
        chartContainer,
        {

            layout:{
                background:{
                    color:"#080d18"
                },

                textColor:"#94a3b8"
            },

            grid:{
                vertLines:{
                    color:"#111827"
                },

                horzLines:{
                    color:"#111827"
                }
            },

            crosshair:{
                mode:1
            },

            rightPriceScale:{
                borderColor:"#1e293b"
            },

            timeScale:{
                borderColor:"#1e293b",

                timeVisible:true,

                secondsVisible:false
            }

        }
    );


const candleSeries =
    chart.addCandlestickSeries({

        upColor:"#22c55e",

        downColor:"#ef4444",

        borderUpColor:"#22c55e",

        borderDownColor:"#ef4444",

        wickUpColor:"#22c55e",

        wickDownColor:"#ef4444"

    });


/* ==========================================================
   RESPONSIVE CHART
========================================================== */

function resizeChart(){

    chart.applyOptions({

        width:
            chartContainer.clientWidth,

        height:
            chartContainer.clientHeight

    });

}


window.addEventListener(
    "resize",
    resizeChart
);

resizeChart();


/* ==========================================================
   CONNECT
========================================================== */

async function connectDeriv(){

    const appId =
        document.getElementById(
            "appId"
        ).value.trim();


    const patToken =
        document.getElementById(
            "patToken"
        ).value.trim();


    const accountId =
        document.getElementById(
            "accountId"
        ).value.trim();


    const symbol =
        document.getElementById(
            "symbol"
        ).value;


    if(!appId){

        alert(
            "Ampidiro aloha ny App ID."
        );

        return;
    }


    if(!patToken){

        alert(
            "Ampidiro aloha ny PAT Token."
        );

        return;
    }


    if(!accountId){

        alert(
            "Ampidiro aloha ny Account ID."
        );

        return;
    }


    setStatus(
        false,
        "Connecting..."
    );


    try{

        const response =
            await fetch(
                "/api/connect",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        app_id:appId,

                        pat_token:patToken,

                        account_id:accountId,

                        symbol:symbol

                    })

                }
            );


        const data =
            await response.json();


        if(!data.ok){

            alert(
                data.message ||
                "Connexion failed."
            );

            return;
        }


        setStatus(
            false,
            "Connecting..."
        );

        setMessage(
            data.message
        );

    }

    catch(error){

        setStatus(
            false,
            "Connection error"
        );

        setMessage(
            error.message
        );

    }

}


/* ==========================================================
   REFRESH MARKET
========================================================== */

async function refreshMarket(){

    const symbol =
        document.getElementById(
            "symbol"
        ).value;


    try{

        await fetch(
            "/api/symbol",
            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    symbol:symbol
                })

            }
        );


        document.getElementById(
            "marketName"
        ).innerText =
            symbol;


        document.getElementById(
            "statSymbol"
        ).innerText =
            symbol;


    }

    catch(error){

        console.log(error);

    }

}


/* ==========================================================
   STOP
========================================================== */

function disconnectBot(){

    location.reload();

}


/* ==========================================================
   STATUS
========================================================== */

function setStatus(
    connected,
    text
){

    const dot =
        document.getElementById(
            "statusDot"
        );


    const status =
        document.getElementById(
            "statusText"
        );


    const stat =
        document.getElementById(
            "statConnection"
        );


    if(connected){

        dot.classList.add(
            "connected"
        );

        status.innerText =
            text || "Connected";

        stat.innerText =
            "ONLINE";

    }

    else{

        dot.classList.remove(
            "connected"
        );

        status.innerText =
            text || "Disconnected";

        stat.innerText =
            "OFF";

    }

}


/* ==========================================================
   MESSAGE
========================================================== */

function setMessage(text){

    document.getElementById(
        "botMessage"
    ).innerText =
        text || "";

}


/* ==========================================================
   SIGNAL
========================================================== */

function setSignal(text){

    const box =
        document.getElementById(
            "signalBox"
        );


    const signal =
        document.getElementById(
            "signalText"
        );


    signal.innerText =
        text || "Miandry...";


    box.classList.remove(
        "buy",
        "error",
        "wait"
    );


    const upper =
        String(text).toUpperCase();


    if(
        upper.includes("CALL") ||
        upper.includes("BUY")
    ){

        box.classList.add(
            "buy"
        );

    }

    else if(
        upper.includes("ERROR") ||
        upper.includes("FAILED")
    ){

        box.classList.add(
            "error"
        );

    }

    else{

        box.classList.add(
            "wait"
        );

    }

}


/* ==========================================================
   UPDATE UI
========================================================== */

async function updateUI(){

    try{

        const response =
            await fetch(
                "/api/stats",
                {
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        /* STATUS */

        setStatus(
            data.connected,
            data.connected
                ? "Connected"
                : "Disconnected"
        );


        /* BALANCE */

        document.getElementById(
            "balance"
        ).innerText =
            Number(
                data.balance || 0
            ).toFixed(2)
            + " "
            + (
                data.currency ||
                "USD"
            );


        /* ACCOUNT */

        document.getElementById(
            "account"
        ).innerText =
            data.connected
                ? "Account: Connected"
                : "Account: Not connected";


        document.getElementById(
            "statAccount"
        ).innerText =
            data.connected
                ? "ONLINE"
                : "OFF";


        /* MARKET */

        document.getElementById(
            "marketName"
        ).innerText =
            data.symbol;


        document.getElementById(
            "statSymbol"
        ).innerText =
            data.symbol;


        /* PRICE */

        const price =
            Number(
                data.price || 0
            );


        document.getElementById(
            "price"
        ).innerText =
            price.toFixed(5);


        document.getElementById(
            "statPrice"
        ).innerText =
            price.toFixed(5);


        /* MESSAGE */

        setMessage(
            data.error
                ? "ERROR: "
                    + data.error
                : data.message
        );


        /* SIGNAL */

        if(data.error){

            setSignal(
                "ERROR: "
                + data.error
            );

        }

        else{

            setSignal(
                data.message ||
                "Miandry signal..."
            );

        }


        /* CHART */

        if(
            data.chart &&
            data.chart.length > 0
        ){

            const candles =
                data.chart.map(
                    c => ({

                        time:
                            Number(
                                c.time
                            ),

                        open:
                            Number(
                                c.open
                            ),

                        high:
                            Number(
                                c.high
                            ),

                        low:
                            Number(
                                c.low
                            ),

                        close:
                            Number(
                                c.close
                            )

                    })
                );


            candleSeries.setData(
                candles
            );


            chart.timeScale()
                .fitContent();

        }

    }

    catch(error){

        console.log(
            "UI error:",
            error
        );

        setStatus(
            false,
            "Server error"
        );

    }

}


/* ==========================================================
   AUTO UPDATE
========================================================== */

setInterval(
    updateUI,
    1000
);


updateUI();


/* ==========================================================
   SYMBOL CHANGE
========================================================== */

document.getElementById(
    "symbol"
).addEventListener(
    "change",
    refreshMarket
);

</script>

</body>
</html>
